<svg viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="160" fill="#ffffff"/>

  <rect x="20" y="45" width="140" height="60" rx="8" fill="#eef6ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="90" y="72" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">hello.cpp</text>
  <text x="90" y="90" text-anchor="middle" font-size="11" fill="#4a5568">your source code</text>

  <line x1="160" y1="75" x2="205" y2="75" stroke="#4a5568" stroke-width="2" marker-end="url(#a1)"/>
  <text x="182" y="65" text-anchor="middle" font-size="10" fill="#4a5568">g++</text>

  <rect x="205" y="45" width="140" height="60" rx="8" fill="#fff5e6" stroke="#dd8c1e" stroke-width="2"/>
  <text x="275" y="72" text-anchor="middle" font-size="13" fill="#7a4a00" font-weight="600">compiler</text>
  <text x="275" y="90" text-anchor="middle" font-size="11" fill="#7a4a00">translates to machine code</text>

  <line x1="345" y1="75" x2="390" y2="75" stroke="#4a5568" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="390" y="45" width="140" height="60" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="460" y="72" text-anchor="middle" font-size="13" fill="#22543d" font-weight="600">hello (executable)</text>
  <text x="460" y="90" text-anchor="middle" font-size="11" fill="#22543d">a program the OS can run</text>

  <line x1="530" y1="75" x2="575" y2="75" stroke="#4a5568" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="575" y="45" width="55" height="60" rx="8" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
  <text x="602" y="80" text-anchor="middle" font-size="20" fill="#1a1a1a">▶</text>

  <text x="320" y="135" text-anchor="middle" font-size="12" fill="#718096">Real life: a recipe (source) → a chef (compiler) → a finished dish (executable) you can actually serve.</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a5568"/>
    </marker>
  </defs>
</svg>
