<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="260" fill="#ffffff"/>

  <rect x="215" y="20" width="130" height="50" rx="8" fill="#eef6ff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="280" y="50" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">check condition</text>

  <line x1="280" y1="70" x2="280" y2="105" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <text x="330" y="92" font-size="12" fill="#2f855a" font-weight="700">true</text>

  <rect x="215" y="105" width="130" height="50" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2.5"/>
  <text x="280" y="135" text-anchor="middle" font-size="13" fill="#22543d" font-weight="600">run loop body</text>

  <!-- loop back arrow -->
  <path d="M 215 130 C 120 130, 120 40, 215 40" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <text x="130" y="90" font-size="11" fill="#4a5568">repeat</text>

  <line x1="280" y1="155" x2="280" y2="185" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <text x="230" y="177" font-size="12" fill="#c53030" font-weight="700">false</text>

  <rect x="215" y="185" width="130" height="50" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2.5"/>
  <text x="280" y="215" text-anchor="middle" font-size="13" fill="#742a2a" font-weight="600">stop looping</text>

  <text x="450" y="70" font-size="12" fill="#718096" text-anchor="middle">Real life:</text>
  <text x="450" y="90" font-size="12" fill="#718096" text-anchor="middle">a washing</text>
  <text x="450" y="108" font-size="12" fill="#718096" text-anchor="middle">machine cycle —</text>
  <text x="450" y="126" font-size="12" fill="#718096" text-anchor="middle">it repeats until</text>
  <text x="450" y="144" font-size="12" fill="#718096" text-anchor="middle">a condition</text>
  <text x="450" y="162" font-size="12" fill="#718096" text-anchor="middle">(timer done)</text>
  <text x="450" y="180" font-size="12" fill="#718096" text-anchor="middle">becomes false.</text>

  <defs>
    <marker id="arrow-loop" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a5568"/>
    </marker>
  </defs>
</svg>
