<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="280" fill="#ffffff"/>

  <text x="150" y="25" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="700">The Call Stack</text>

  <!-- stacked boxes, bottom = main, top = most recent call -->
  <rect x="60" y="170" width="180" height="50" rx="6" fill="#eef6ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="150" y="200" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">main()</text>

  <rect x="60" y="115" width="180" height="50" rx="6" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
  <text x="150" y="145" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">calculate(5)</text>

  <rect x="60" y="60" width="180" height="50" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="150" y="90" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">square(5)</text>

  <text x="150" y="245" text-anchor="middle" font-size="11" fill="#718096">Each call stacks on top of</text>
  <text x="150" y="261" text-anchor="middle" font-size="11" fill="#718096">the one that made it.</text>

  <!-- explanation right side -->
  <text x="420" y="60" text-anchor="middle" font-size="12" fill="#718096" font-weight="700">Real life:</text>
  <text x="420" y="80" text-anchor="middle" font-size="12" fill="#718096">a stack of plates —</text>
  <text x="420" y="98" text-anchor="middle" font-size="12" fill="#718096">you can only take the</text>
  <text x="420" y="116" text-anchor="middle" font-size="12" fill="#718096">top one off first.</text>
  <text x="420" y="144" text-anchor="middle" font-size="12" fill="#718096">square() finishes →</text>
  <text x="420" y="162" text-anchor="middle" font-size="12" fill="#718096">control returns to</text>
  <text x="420" y="180" text-anchor="middle" font-size="12" fill="#718096">calculate(), then main().</text>

  <line x1="260" y1="85" x2="330" y2="85" stroke="#2f855a" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="260" y1="140" x2="330" y2="153" stroke="#2c7a7b" stroke-width="2" stroke-dasharray="4,3"/>
</svg>
