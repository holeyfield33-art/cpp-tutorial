<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="200" fill="#ffffff"/>

  <!-- The box / storage -->
  <rect x="230" y="60" width="160" height="90" rx="10" fill="#eef6ff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="310" y="45" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="600">A variable is a labeled box</text>

  <!-- label tag on top of box -->
  <rect x="255" y="45" width="110" height="26" rx="6" fill="#2b6cb0"/>
  <text x="310" y="63" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">age</text>

  <!-- value inside box -->
  <text x="310" y="115" text-anchor="middle" font-size="30" fill="#1a1a1a" font-weight="700">25</text>
  <text x="310" y="138" text-anchor="middle" font-size="13" fill="#4a5568">stored value</text>

  <!-- type callout -->
  <rect x="440" y="80" width="130" height="50" rx="8" fill="#fff5e6" stroke="#dd8c1e" stroke-width="2"/>
  <text x="505" y="100" text-anchor="middle" font-size="13" fill="#7a4a00" font-weight="600">type: int</text>
  <text x="505" y="118" text-anchor="middle" font-size="11" fill="#7a4a00">(what kind of value)</text>
  <line x1="390" y1="105" x2="440" y2="105" stroke="#dd8c1e" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- name callout -->
  <rect x="40" y="80" width="150" height="50" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="115" y="100" text-anchor="middle" font-size="13" fill="#22543d" font-weight="600">name: age</text>
  <text x="115" y="118" text-anchor="middle" font-size="11" fill="#22543d">(how you refer to it)</text>
  <line x1="190" y1="105" x2="230" y2="105" stroke="#2f855a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <text x="310" y="180" text-anchor="middle" font-size="12" fill="#718096">int age{25};  →  name = age, type = int, value = 25</text>

  <defs>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dd8c1e"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f855a"/>
    </marker>
  </defs>
</svg>
